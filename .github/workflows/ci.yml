name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No setup-toolchain action on purpose: the runner ships rustup, and
      # rustup honours rust-toolchain.toml on its own. Pinning the toolchain
      # here as well would just give us two sources of truth that can drift.
      - name: Show pinned toolchain
        run: |
          rustup show active-toolchain
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
