name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  verify:
    name: verify tag and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2

      - name: Tag matches Cargo.toml
        run: scripts/check-version.sh "${GITHUB_REF_NAME}"

      - name: Test
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  build:
    name: build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      # Build every target even if one fails, so a single broken target
      # reports alongside the others instead of masking them.
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-apple-darwin
            runner: macos-14
    steps:
      # Full history: build-release.sh reads the commit timestamp for
      # SOURCE_DATE_EPOCH.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build
        run: scripts/build-release.sh "${{ matrix.target }}"

      - uses: actions/upload-artifact@v7
        with:
          name: tekops-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: publish release
    # Depends on every build job: a release whose assets disagree about
    # which platforms a version supports is worse than no release.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: |
          cd artifacts
          sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            artifacts/*.tar.gz \
            artifacts/SHA256SUMS
