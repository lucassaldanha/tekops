name: Release

on:
  # The normal path: run this from the Actions tab or with
  # `gh workflow run release.yml -f version=X.Y.Z`. The bump, the tag and
  # the release all happen here.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, as X.Y.Z (a leading v is accepted)'
        required: true
        type: string
  # The fallback: a hand-pushed tag on an already-bumped commit. Skips the
  # prepare step and behaves exactly as this workflow always has.
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  # Resolves the one pair of values every later job needs - which tag is being
  # published, and which commit it names - so that neither path has to be
  # special-cased again downstream. On the dispatch path it also writes the
  # bump commit that `sha` then points at.
  prepare:
    name: prepare
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Bump, commit and push
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ inputs.version }}
          BRANCH: ${{ github.ref_name }}
        run: scripts/prepare-release.sh "$VERSION" "$BRANCH"

      - name: Resolve tag and commit
        id: resolve
        env:
          EVENT: ${{ github.event_name }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            tag="v${VERSION#v}"
            sha="$(git rev-parse HEAD)"
          else
            tag="${GITHUB_REF_NAME}"
            sha="${GITHUB_SHA}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "publishing $tag from $sha"

  verify:
    name: verify tag and test
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: Swatinem/rust-cache@v2

      - name: Tag matches Cargo.toml
        run: scripts/check-version.sh "${{ needs.prepare.outputs.tag }}"

      - name: Test
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  build:
    name: build ${{ matrix.target }}
    needs: [prepare, verify]
    runs-on: ${{ matrix.runner }}
    strategy:
      # Build every target even if one fails, so a single broken target
      # reports alongside the others instead of masking them.
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
          # GitHub-hosted and arm64, so the target builds natively. Pinned to
          # an image version rather than macos-latest, which moves to a new
          # macOS and Xcode without a change here.
          - target: aarch64-apple-darwin
            runner: macos-15
    steps:
      # Full history: build-release.sh reads the commit timestamp for
      # SOURCE_DATE_EPOCH. The explicit ref is what makes the dispatch path
      # build the bump commit rather than the branch as it stood when the
      # workflow was started.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0

      # Only the macOS leg compiles on the host; the Linux legs compile inside
      # a digest-pinned container that carries its own toolchain. This is the
      # one place rust-toolchain.toml could be silently ignored - by a Rust on
      # the runner image that is not rustup's. Failing here is the whole point:
      # an unpinned compiler produces a perfectly good binary and says nothing.
      - name: Toolchain is the pinned one
        if: matrix.target == 'aarch64-apple-darwin'
        run: scripts/check-toolchain.sh

      # Two steps for one command, so the signing secrets are only ever put in
      # the environment of the one runner that needs them. Naming them
      # unconditionally would hand them to both Linux jobs as well, which sign
      # nothing.
      - name: Build
        if: matrix.target != 'aarch64-apple-darwin'
        run: scripts/build-release.sh "${{ matrix.target }}"

      - name: Build, sign and notarize
        if: matrix.target == 'aarch64-apple-darwin'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: scripts/build-release.sh "${{ matrix.target }}"

      - uses: actions/upload-artifact@v7
        with:
          name: tekops-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: publish release
    # Depends on every build job: a release whose assets disagree about
    # which platforms a version supports is worse than no release.
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: |
          cd artifacts
          sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      # --target creates the tag as part of publishing, which is why nothing
      # earlier does. On the tag-push path the tag already exists and --target
      # is ignored; on the dispatch path this is the moment the version
      # becomes real, after every build has already succeeded.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --target "$SHA" \
            --generate-notes \
            artifacts/*.tar.gz \
            artifacts/SHA256SUMS

  # Points the Homebrew tap at the release that was just published. After
  # `release` rather than inside it: the formula's urls only resolve once the
  # assets are public, and a failure here leaves a good release that only needs
  # this job re-run, not a half-published one.
  tap:
    name: update homebrew tap
    needs: [prepare, release]
    runs-on: ubuntu-latest
    # Nothing in this repository is written; the push goes to the tap with its
    # own token.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      # A fine-grained token scoped to lucassaldanha/homebrew-tekops alone,
      # Contents: read and write. github.token cannot push to another repo.
      # Checked explicitly because a missing or misspelled secret is an empty
      # string, which would otherwise surface as a confusing clone failure.
      - name: Render and push the formula
        env:
          GH_TOKEN: ${{ github.token }}
          TAP_TOKEN: ${{ secrets.TEKOPS_TAP_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "TEKOPS_TAP_TOKEN is not set; see docs/RELEASING.md" >&2
            exit 1
          fi
          # The published SHA256SUMS rather than a rebuilt one, so the formula
          # carries exactly the checksums users download.
          gh release download "$TAG" --pattern SHA256SUMS --dir "$RUNNER_TEMP"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/lucassaldanha/homebrew-tekops.git" "$RUNNER_TEMP/tap"
          mkdir -p "$RUNNER_TEMP/tap/Formula"
          scripts/render-formula.sh "$TAG" "$RUNNER_TEMP/SHA256SUMS" > "$RUNNER_TEMP/tap/Formula/tekops.rb"
          cd "$RUNNER_TEMP/tap"
          git add Formula/tekops.rb
          # A re-run for the same release renders the same file; that is done,
          # not a failure.
          if git diff --cached --quiet; then
            echo "formula already at $TAG"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "tekops ${TAG#v}"
          git push origin HEAD
