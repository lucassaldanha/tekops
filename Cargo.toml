[package]
name = "tekops"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
comfy-table = "7"
ctrlc = { version = "3", features = ["termination"] }
tempfile = "3"

[dev-dependencies]
mockito = "1"

[profile.release]
# Stripping removes symbol paths that would otherwise vary between build
# environments, so this serves reproducibility as well as binary size.
strip = true
